<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eiwit Tracker</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2130;
    --card2: #212a3d;
    --text: #e8edf5;
    --muted: #8b98ad;
    --accent: #4f8cff;
    --green: #34c98e;
    --red: #ff6b6b;
    --border: #2c3648;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app { width: 100%; max-width: 560px; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 16px;
  }
  .date-nav button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 40px; height: 40px;
    border-radius: 10px;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .date-nav button:hover { background: var(--card2); }
  .date-label { font-weight: 600; font-size: 1.05rem; text-align: center; flex: 1; }
  .date-label small { display: block; color: var(--muted); font-weight: 400; font-size: 0.8rem; }

  .total-box { text-align: center; }
  .total-number { font-size: 2.6rem; font-weight: 700; }
  .total-number span.unit { font-size: 1.1rem; color: var(--muted); font-weight: 500; }
  .goal-line { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
  .progress {
    background: var(--card2);
    border-radius: 999px;
    height: 12px;
    margin-top: 12px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--green);
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .progress-bar.over { background: var(--accent); }

  form .row { display: flex; gap: 8px; }
  form .row + .row { margin-top: 8px; }
  input, select {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    font-size: 1rem;
    width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input::placeholder { color: var(--muted); }
  #grams { width: 110px; }
  #proteinPer100 { width: 100%; }
  .hint { color: var(--muted); font-size: 0.8rem; margin-top: 8px; }
  .add-btn {
    width: 100%;
    margin-top: 10px;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
  }
  .add-btn:hover { filter: brightness(1.1); }

  .autocomplete { position: relative; flex: 1; }
  .suggestions {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-top: 4px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 10;
    display: none;
  }
  .suggestions div {
    padding: 10px 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
  }
  .suggestions div:hover, .suggestions div.active { background: var(--accent); color: #fff; }
  .suggestions .p { color: var(--muted); }
  .suggestions div:hover .p, .suggestions div.active .p { color: #dce6ff; }

  .entries h2 { font-size: 1rem; margin-bottom: 10px; color: var(--muted); }
  .entry {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .entry:last-child { border-bottom: none; }
  .entry .food { flex: 1; font-weight: 500; }
  .entry .detail { color: var(--muted); font-size: 0.85rem; }
  .entry .protein { font-weight: 700; color: var(--green); white-space: nowrap; }
  .delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 4px 6px;
  }
  .delete:hover { color: var(--red); }
  .empty { color: var(--muted); text-align: center; padding: 16px 0; font-size: 0.9rem; }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .settings-row label { color: var(--muted); font-size: 0.9rem; }
  #goalInput { width: 110px; text-align: right; }
  .footer { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <h1>💪 Eiwit Tracker</h1>
  <p class="subtitle">Voer je voeding en grammen in — het eiwittotaal rekenen wij uit.</p>

  <div class="date-nav">
    <button type="button" id="prevDay" title="Vorige dag">‹</button>
    <div class="date-label" id="dateLabel"></div>
    <button type="button" id="nextDay" title="Volgende dag">›</button>
  </div>

  <div class="card total-box">
    <div class="total-number"><span id="totalValue">0</span> <span class="unit">g eiwit</span></div>
    <div class="goal-line" id="goalLine"></div>
    <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  </div>

  <div class="card">
    <form id="entryForm" autocomplete="off">
      <div class="row">
        <div class="autocomplete">
          <input type="text" id="foodName" placeholder="Voeding (bijv. kipfilet)" required>
          <div class="suggestions" id="suggestions"></div>
        </div>
        <input type="number" id="grams" placeholder="gram" min="1" step="any" required>
      </div>
      <div class="row">
        <input type="number" id="proteinPer100" placeholder="Eiwit per 100 g (optioneel)" min="0" max="100" step="any">
      </div>
      <button type="submit" class="add-btn">+ Toevoegen</button>
      <p class="hint">Kies een voeding uit de lijst en het eiwitgehalte wordt automatisch ingevuld. Onbekende voeding? Vul zelf het eiwit per 100 g in.</p>
    </form>
  </div>

  <div class="card entries">
    <h2 id="entriesTitle">Toegevoegd</h2>
    <div id="entryList"></div>
  </div>

  <div class="card">
    <div class="settings-row">
      <label for="goalInput">Dagelijkse eiwitdoel (gram)</label>
      <input type="number" id="goalInput" min="1" step="any">
    </div>
  </div>

  <p class="footer">Alles wordt lokaal in je browser opgeslagen.</p>
</div>

<script>
"use strict";

const FOOD_DB = [
  { name: "Kipfilet", p: 31 },
  { name: "Kippendij", p: 24 },
  { name: "Rundvlees (mager)", p: 26 },
  { name: "Gehakt (half-om)", p: 20 },
  { name: "Varkensvlees (mager)", p: 25 },
  { name: "Zalm", p: 25 },
  { name: "Tonijn (blik op water)", p: 25 },
  { name: "Kabeljauw", p: 18 },
  { name: "Garnalen", p: 24 },
  { name: "Makreel", p: 23 },
  { name: "Ei", p: 13 },
  { name: "Melk (halfvol)", p: 3.5 },
  { name: "Magere yoghurt", p: 5 },
  { name: "Griekse yoghurt", p: 10 },
  { name: "Skyr", p: 11 },
  { name: "Kwark", p: 8 },
  { name: "Goudse kaas", p: 25 },
  { name: "Hüttenkäse", p: 12 },
  { name: "Mozzarella", p: 18 },
  { name: "Cottage cheese", p: 12 },
  { name: "Witte kaas (feta)", p: 14 },
  { name: "Eiwitpoeder (whey)", p: 78 },
  { name: "Tofu", p: 12 },
  { name: "Tempeh", p: 19 },
  { name: "Seitan", p: 25 },
  { name: "Linzen (gekookt)", p: 9 },
  { name: "Kikkererwten (gekookt)", p: 9 },
  { name: "Zwarte bonen (gekookt)", p: 9 },
  { name: "Witte bonen (gekookt)", p: 9 },
  { name: "Edamame", p: 11 },
  { name: "Quinoa (gekookt)", p: 4.4 },
  { name: "Zwart-wit brood", p: 8 },
  { name: "Volkorenbrood", p: 8.5 },
  { name: "Havermout (droog)", p: 13.5 },
  { name: "Pasta (gekookt)", p: 5 },
  { name: "Zilvervliesrijst (gekookt)", p: 2.6 },
  { name: "Aardappelen (gekookt)", p: 2 },
  { name: "Zoete aardappel", p: 2 },
  { name: "Pindakaas", p: 25 },
  { name: "Pinda's", p: 26 },
  { name: "Amandelen", p: 21 },
  { name: "Walnoten", p: 15 },
  { name: "Cashewnoten", p: 18 },
  { name: "Chiazaad", p: 17 },
  { name: "Zonnebloempitten", p: 21 },
  { name: "Pompoenpitten", p: 30 },
  { name: "Kalkoenfilet", p: 29 },
  { name: "Ontbijtspek", p: 20 },
  { name: "Worst (rookworst)", p: 13 },
  { name: "Hüttenkäse salade", p: 11 },
  { name: "Soja drank", p: 3.3 },
  { name: "Karnemelk", p: 3.3 },
  { name: "Chocolademelk (halfvol)", p: 3.2 },
  { name: "Bulgur (gekookt)", p: 3.1 },
  { name: "Couscous (gekookt)", p: 3.8 },
  { name: "Spinazie", p: 2.9 },
  { name: "Broccoli", p: 2.8 },
  { name: "Erwten (gekookt)", p: 5.4 },
  { name: "Mais (korrels)", p: 3.3 },
  { name: "Champignons", p: 3.1 },
  { name: "Kefir", p: 3.5 },
  { name: "Proteline / eiwitdrank", p: 10 },
  { name: "Vleeswaren (kipfilet op brood)", p: 20 },
  { name: "Zalmfilet (gerookt)", p: 22 },
  { name: "Biefstuk", p: 27 },
  { name: "Hertenbiefstuk", p: 24 },
  { name: "Konijn", p: 21 },
  { name: "Sardines (blik)", p: 24 },
  { name: "Mosselen", p: 12 },
  { name: "Inktvis", p: 16 }
];

const STORAGE_KEY = "eiwit-tracker-v1";
const DAY_MS = 24 * 60 * 60 * 1000;

let state = {
  entries: {},
  goal: 100,
  customFoods: [],
  offset: 0
};

function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function dateKeyForOffset(offset) {
  return new Date(Date.now() + offset * DAY_MS).toISOString().slice(0, 10);
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && typeof data === "object") {
        state.entries = data.entries || {};
        state.goal = Number(data.goal) > 0 ? Number(data.goal) : 100;
        state.customFoods = Array.isArray(data.customFoods) ? data.customFoods : [];
      }
    }
  } catch (e) { /* beschadigde data negeren */ }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    entries: state.entries,
    goal: state.goal,
    customFoods: state.customFoods
  }));
}

function allFoods() {
  return FOOD_DB.concat(state.customFoods);
}

function findFood(name) {
  const lower = name.trim().toLowerCase();
  return allFoods().find(f => f.name.toLowerCase() === lower) || null;
}

function entriesForCurrentDay() {
  const key = dateKeyForOffset(state.offset);
  return state.entries[key] || [];
}

function formatDayLabel() {
  const key = dateKeyForOffset(state.offset);
  const d = new Date(key + "T12:00:00");
  const opts = { weekday: "long", day: "numeric", month: "long" };
  let label = d.toLocaleDateString("nl-NL", opts);
  label = label.charAt(0).toUpperCase() + label.slice(1);
  let sub = key;
  if (state.offset === 0) sub = "vandaag";
  else if (state.offset === -1) sub = "gisteren";
  else if (state.offset === 1) sub = "morgen";
  return label + ' <small>' + sub + '</small>';
}

function render() {
  const list = entriesForCurrentDay();
  const total = list.reduce((sum, e) => sum + e.protein, 0);

  document.getElementById("dateLabel").innerHTML = formatDayLabel();
  document.getElementById("totalValue").textContent = Math.round(total * 10) / 10;

  const goalLine = document.getElementById("goalLine");
  const bar = document.getElementById("progressBar");
  if (state.goal > 0) {
    const pct = Math.min((total / state.goal) * 100, 100);
    bar.style.width = pct + "%";
    bar.classList.toggle("over", total > state.goal);
    const rest = Math.round((state.goal - total) * 10) / 10;
    goalLine.textContent = rest > 0
      ? "Nog " + rest + " g tot je doel van " + state.goal + " g"
      : "Doel van " + state.goal + " g gehaald! 🎉";
  } else {
    bar.style.width = "0%";
    goalLine.textContent = "";
  }

  document.getElementById("entriesTitle").textContent =
    state.offset === 0 ? "Vandaag toegevoegd" : "Toegevoegd";

  const listEl = document.getElementById("entryList");
  listEl.innerHTML = "";
  if (list.length === 0) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Nog niets toegevoegd op deze dag.";
    listEl.appendChild(p);
  } else {
    list.forEach((e, i) => {
      const row = document.createElement("div");
      row.className = "entry";

      const left = document.createElement("div");
      left.className = "food";
      left.textContent = e.food;

      const detail = document.createElement("div");
      detail.className = "detail";
      detail.textContent = e.grams + " g × " + e.per100 + " g/100g";

      const protein = document.createElement("div");
      protein.className = "protein";
      protein.textContent = Math.round(e.protein * 10) / 10 + " g";

      const del = document.createElement("button");
      del.className = "delete";
      del.title = "Verwijderen";
      del.textContent = "✕";
      del.addEventListener("click", () => removeEntry(i));

      row.appendChild(left);
      row.appendChild(detail);
      row.appendChild(protein);
      row.appendChild(del);
      listEl.appendChild(row);
    });
  }
}

function removeEntry(index) {
  const key = dateKeyForOffset(state.offset);
  state.entries[key].splice(index, 1);
  if (state.entries[key].length === 0) delete state.entries[key];
  save();
  render();
}

const foodInput = document.getElementById("foodName");
const proteinInput = document.getElementById("proteinPer100");
const suggestionsEl = document.getElementById("suggestions");
let activeIndex = -1;
let currentMatches = [];

function showSuggestions() {
  const query = foodInput.value.trim().toLowerCase();
  currentMatches = [];
  if (query) {
    currentMatches = allFoods().filter(f => f.name.toLowerCase().includes(query)).slice(0, 8);
  }
  suggestionsEl.innerHTML = "";
  activeIndex = -1;

  if (currentMatches.length === 0) {
    suggestionsEl.style.display = "none";
    return;
  }
  currentMatches.forEach((f, i) => {
    const item = document.createElement("div");
    item.innerHTML = "<span>" + f.name + "</span><span class='p'>" + f.p + " g/100g</span>";
    item.addEventListener("mousedown", (ev) => {
      ev.preventDefault();
      pickFood(f);
    });
    suggestionsEl.appendChild(item);
  });
  suggestionsEl.style.display = "block";
}

function pickFood(f) {
  foodInput.value = f.name;
  proteinInput.value = f.p;
  suggestionsEl.style.display = "none";
  document.getElementById("grams").focus();
}

foodInput.addEventListener("input", showSuggestions);
foodInput.addEventListener("focus", showSuggestions);
foodInput.addEventListener("blur", () => {
  setTimeout(() => { suggestionsEl.style.display = "none"; }, 100);
});
foodInput.addEventListener("keydown", (ev) => {
  const items = suggestionsEl.querySelectorAll("div");
  if (suggestionsEl.style.display !== "block" || items.length === 0) return;
  if (ev.key === "ArrowDown") {
    ev.preventDefault();
    activeIndex = (activeIndex + 1) % items.length;
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    activeIndex = (activeIndex - 1 + items.length) % items.length;
  } else if (ev.key === "Enter" && activeIndex >= 0) {
    ev.preventDefault();
    pickFood(currentMatches[activeIndex]);
    return;
  } else if (ev.key === "Escape") {
    suggestionsEl.style.display = "none";
    return;
  } else {
    return;
  }
  items.forEach((el, i) => el.classList.toggle("active", i === activeIndex));
});

document.getElementById("entryForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const food = foodInput.value.trim();
  const grams = parseFloat(document.getElementById("grams").value);
  let per100 = parseFloat(proteinInput.value);

  if (!food || !grams || grams <= 0) return;

  if (isNaN(per100) || per100 < 0) {
    const known = findFood(food);
    if (known) {
      per100 = known.p;
    } else {
      alert("Vul het eiwitgehalte per 100 g in voor '" + food + "'. Dat wordt daarna onthouden.");
      proteinInput.focus();
      return;
    }
  }

  const key = dateKeyForOffset(state.offset);
  if (!state.entries[key]) state.entries[key] = [];
  state.entries[key].push({
    food: food.charAt(0).toUpperCase() + food.slice(1),
    grams: grams,
    per100: per100,
    protein: (grams / 100) * per100
  });

  if (!findFood(food)) {
    state.customFoods.push({ name: food.charAt(0).toUpperCase() + food.slice(1), p: per100 });
  }

  save();
  render();

  foodInput.value = "";
  proteinInput.value = "";
  document.getElementById("grams").value = "";
  foodInput.focus();
});

document.getElementById("prevDay").addEventListener("click", () => {
  state.offset -= 1;
  render();
});
document.getElementById("nextDay").addEventListener("click", () => {
  if (state.offset < 0) {
    state.offset += 1;
    render();
  }
});

const goalInput = document.getElementById("goalInput");
goalInput.addEventListener("change", () => {
  const v = parseFloat(goalInput.value);
  state.goal = v > 0 ? v : 100;
  goalInput.value = state.goal;
  save();
  render();
});

load();
goalInput.value = state.goal;
render();
</script>
</body>
</html>
